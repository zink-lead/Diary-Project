<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Form</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap" rel="stylesheet">
    <script src="script.js" defer></script>

</head>
<body>

    <nav class="nav-container">
        <ul class="nav-links"> 
            <li><a href="index.html">Index</a></li>
            <li><a href="vault.html">Vault</a></li>
        </ul>
    </nav>
<!-- form, including the save entry and cancel buttons-->
<form class="form" id="entryForm">
    <label for="title">Title</label>
    <input type="text" id="title" name="title">

    <label for="description">Reflect</label>
    <textarea id="description" name="description"></textarea>
<div class="buttons">
    <div class="action-btn">
        <button id="saveBtn" type="submit">Save Entry</button>
        <button type="reset">Discard</button>

    </div> 
</div>
<!---aria-live"polite" added for use with screen readers, for feedback on diary enrtry-->
<!--on button click, class feedback changed to feedbackshow,activating the timer for 2.5seconds then changed to 0 opaque-->
<p id="feedback" class="feedback" role="status" aria-live="polite"></p>
</form>

</body>
</html>
